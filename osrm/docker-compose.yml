# Local osrm-routed only. Do not deploy this to Vercel.
# Build the graphs first: osrm/scripts/build-taiwan.sh
# Car:        http://127.0.0.1:5000/route/v1/driving
# Motorcycle: http://127.0.0.1:5001/route/v1/driving

services:
  osrm-car:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    command: osrm-routed --algorithm mld /data/taiwan.osrm
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/car:/data:ro

  osrm-motorcycle:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    command: osrm-routed --algorithm mld /data/taiwan.osrm
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./data/motorcycle:/data:ro
